appId: com.keebind.app
productName: Keebind
directories:
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - '**/*.node'
# Both native deps (uiohook-napi, node-hid) ship N-API prebuilds for every
# target platform, so no per-build rebuild is needed — and disabling it is
# what makes Windows cross-builds from macOS possible.
npmRebuild: false
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  identity: null
  extendInfo:
    LSUIElement: true
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
