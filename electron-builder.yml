appId: com.keebind.app
productName: KeeBind
directories:
  buildResources: build
files:
  - out/**
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - '**/*.node'
# uiohook-napi ships N-API prebuilds for every target platform, so no per-build
# rebuild is needed, and disabling it is what makes Windows cross-builds from
# macOS possible.
npmRebuild: false
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
  # Ad-hoc signing, NOT `identity: null`. macOS privacy (TCC) identifies an app
  # by its code signature: skipping signing leaves Electron's own linker
  # signature in place (`Identifier=Electron`, Info.plist unbound), so the
  # Accessibility / Input Monitoring panes attribute the request to whatever
  # launched the app instead of to KeeBind. Ad-hoc signing binds Info.plist and
  # seals resources, so the panes read "KeeBind" / com.keebind.app.
  # Note: an ad-hoc signature changes with every build, so grants must be
  # re-given after an update until there is a real Developer ID certificate.
  identity: '-'
  # Required with ad-hoc: hardened runtime enforces library validation, which
  # rejects the pre-signed Electron framework (different Team ID).
  hardenedRuntime: false
  extendInfo:
    CFBundleName: KeeBind
    CFBundleDisplayName: KeeBind
    # LSUIElement is deliberately absent. KeeBind shows a Dock icon by default
    # and hides it at runtime (app.dock.hide) when "Show in Dock" is turned off.
    NSAppleEventsUsageDescription: KeeBind uses Apple Events to launch the apps your bindings point at.
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: true
  deleteAppDataOnUninstall: false
